version: 2

updates:
  # Provider constraints and lockfiles live under modules/*, not the repo root.
  - package-ecosystem: "terraform"
    directories:
      - "/modules/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # One PR a month: all minor+patch provider bumps grouped. Majors open individually.
    groups:
      terraform-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
