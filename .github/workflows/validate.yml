name: validate

on:
  pull_request:
  push:
    branches: [main]

# No AWS credentials are configured in this workflow: everything here runs offline.
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4   # installs the versions pinned in mise.toml

      - name: Install gitleaks
        run: |
          V=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: OpenTofu fmt
        run: tofu fmt -recursive -check modules

      - name: Terragrunt HCL fmt
        run: terragrunt hcl fmt --check --diff

      - name: tflint (all modules)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          for d in modules/*/; do (cd "$d" && tflint) || exit 1; done

      - name: trivy config
        run: trivy config . --exit-code 1 --skip-version-check

      - name: terraform-docs drift check
        run: |
          for d in modules/*/; do
            terraform-docs markdown table --output-file README.md --output-mode inject "$d"
          done
          if ! git diff --quiet -- 'modules/*/README.md'; then
            echo "::error::A module README is stale. Run 'make docs' and commit."
            git --no-pager diff -- 'modules/*/README.md'
            exit 1
          fi

      - name: gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Seed account config from examples
        run: for a in management staging prod; do cp live/$a/account.hcl.example live/$a/account.hcl; done

      - name: Offline validate (no credentials)
        # shell: bash for -o pipefail; without it the pipeline reports tee's status and a failed
        # make would pass. Same reasoning as the plan workflow.
        shell: bash
        run: |
          set -euo pipefail
          make validate-all 2>&1 | tee /tmp/validate.log

      - name: Assert validation selected no unconstrained provider
        # A unit inherits any generated provider block as a provider REQUIREMENT. If its module
        # does not also declare that provider, the requirement carries no version constraint, and
        # init resolves it to whatever the registry published today and writes the result into the
        # unit's lockfile -- so an offline, read-only validate silently picks versions. Catching it
        # needs the log: nothing under .terragrunt-stack/ is tracked, so git sees no change.
        # See docs/adr/0012.
        run: |
          if grep -qE 'Finding latest version of' /tmp/validate.log; then
            echo "::error::validation resolved a provider with no version constraint:"
            grep -E 'Finding latest version of' /tmp/validate.log | sort -u
            exit 1
          fi
          echo "no unconstrained provider resolution during validate"

  test:
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Cache OpenTofu providers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.plugin-cache
          key: tofu-plugins-${{ hashFiles('modules/*/.terraform.lock.hcl') }}
          restore-keys: tofu-plugins-

      - name: Prepare plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Install conftest
        run: |
          V=0.69.0
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${V}/conftest_${V}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest
          conftest --version

      - name: Module unit tests + policy tests
        run: make test

  # Not a required status check. It reports; branch protection decides what to do
  # with the report, and that is a repository setting, not this file's business.
  identity:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because this job compares two commits that are not HEAD.
      # The default shallow clone fetches one commit, so the base of the range
      # would not exist locally and the walk would silently check nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Identity, trailers and tags over the pushed range
        shell: bash
        env:
          # Read through the environment rather than interpolated into the script,
          # so a ref or SHA can never be re-parsed as shell.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          CANONICAL='Paul Bezilla <bezilla@protonmail.com>'
          # The whole trailer policy. Signed-off-by must carry the canonical identity
          # exactly; Verified and Measured are free text, recording evidence rather
          # than authorship. Every other key is refused.
          #
          # An allowlist rather than a list of names to search for: a denylist catches
          # only what somebody thought to write down, and is stale the day a tool ships
          # using a word nobody predicted. Any tool that stamps provenance onto a commit
          # does it through a trailer, so an unlisted key is refused whether or not this
          # file has heard of what wrote it.
          ALLOWED_TRAILERS='Signed-off-by, Verified, Measured'

          Z=0000000000000000000000000000000000000000
          status=0

          # Trailers are read with git's own parser: the last paragraph, and only when
          # the whole paragraph parses as trailers. A ^Key: regex would be simpler and
          # would reject this repository's own commit prose -- there are dozens of
          # Key: Value shaped lines in these messages (docs:, chore:, ci:, test:, once:,
          # zone:, cannot:) and not one of them is a trailer.
          #
          # Returns non-zero and explains on the first trailer outside the allowlist.
          check_trailers() {
            local what="$1" text="$2" trailers line key value
            trailers="$(printf '%s\n' "$text" | git interpret-trailers --parse 2>/dev/null || true)"
            [ -z "$trailers" ] && return 0

            while IFS= read -r line; do
              [ -z "$line" ] && continue
              key="${line%%:*}"
              value="${line#*:}"
              value="${value# }"
              case "$key" in
                'Signed-off-by')
                  if [ "$value" != "$CANONICAL" ]; then
                    echo "  ${what} carries \"Signed-off-by: ${value}\", expected \"${CANONICAL}\""
                    return 1
                  fi
                  ;;
                'Verified'|'Measured')
                  : # free text, by design
                  ;;
                *)
                  echo "  ${what} carries disallowed trailer \"${key}\" (allowed: ${ALLOWED_TRAILERS})"
                  return 1
                  ;;
              esac
            done <<< "$trailers"
            return 0
          }

          # A first push to a branch reports an all-zero base, and a force push
          # reports a base that is no longer an ancestor. Both fall back to every
          # commit reachable from the head, which checks more than the range, never
          # less -- the safe direction for a gate.
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "$Z" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${HEAD_SHA}"
          elif ! git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"; then
            range="${HEAD_SHA}"
          else
            range="${BASE_SHA}..${HEAD_SHA}"
          fi

          count="$(git rev-list --count "$range")"
          echo "range: $range"
          echo "commits in range: $count"

          if [ "$count" -eq 0 ]; then
            echo "no commits in range; nothing to check"
            exit 0
          fi

          # --- one identity, as author and as committer, on every commit ---------
          identities="$(git log --format='%an <%ae>|%cn <%ce>' "$range" | sort -u)"
          lines="$(printf '%s\n' "$identities" | grep -c .)"
          echo "distinct author|committer pairs: $lines"
          printf '%s\n' "$identities" | sed 's/^/  /'
          if [ "$lines" -ne 1 ] || [ "$identities" != "${CANONICAL}|${CANONICAL}" ]; then
            echo "::error::expected exactly one identity, '${CANONICAL}|${CANONICAL}'"
            status=1
          fi

          # --- no trailer outside the allowlist, on any commit in the range ------
          # The || guards are load-bearing: `shell: bash` runs this under -e, so a
          # bare non-zero command kills the step before the count is reported.
          trailer_hits=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            check_trailers "commit ${sha:0:12}" "$(git show -s --format='%B' "$sha")" ||
              trailer_hits=$((trailer_hits + 1))
          done < <(git rev-list "$range")

          echo "commits carrying a trailer outside the allowlist: $trailer_hits"
          if [ "$trailer_hits" -ne 0 ]; then
            echo "::error::commit trailers in range are outside the allowlist (${ALLOWED_TRAILERS})"
            status=1
          fi

          # --- annotated tags: tagger identity and annotation body ---------------
          # Tags are not part of a push range, so they are enumerated directly. This
          # reaches refs/tags and nothing else -- refs/pull stays out of scope, for
          # the reason the range fallback exists at all: this gate checks what this
          # repository authored, and a permanent ref it did not write is not that.
          tag_count=0
          tagger_hits=0
          tag_trailer_hits=0
          while read -r ref obj; do
            [ -z "${obj:-}" ] && continue
            [ "$(git cat-file -t "$obj" 2>/dev/null || true)" = 'tag' ] || continue
            tag_count=$((tag_count + 1))
            raw="$(git cat-file tag "$obj")"
            tagger="$(printf '%s\n' "$raw" | sed -n 's/^tagger \(.*\) [0-9][0-9]* [-+][0-9][0-9][0-9][0-9]$/\1/p' | head -1)"
            if [ "$tagger" != "$CANONICAL" ]; then
              echo "  tag ${ref#refs/tags/} tagger is '${tagger}'"
              tagger_hits=$((tagger_hits + 1))
            fi
            check_trailers "tag ${ref#refs/tags/}" "$(printf '%s\n' "$raw" | sed '1,/^$/d')" ||
              tag_trailer_hits=$((tag_trailer_hits + 1))
          done < <(git for-each-ref --format='%(refname) %(objectname)' refs/tags)

          echo "annotated tags checked: $tag_count"
          echo "tags whose tagger is not the canonical identity: $tagger_hits"
          echo "tags carrying a trailer outside the allowlist: $tag_trailer_hits"
          if [ "$tagger_hits" -ne 0 ]; then
            echo "::error::annotated tags carry a non-canonical tagger"
            status=1
          fi
          if [ "$tag_trailer_hits" -ne 0 ]; then
            echo "::error::tag annotations carry trailers outside the allowlist"
            status=1
          fi

          exit "$status"
