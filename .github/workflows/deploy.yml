name: deploy

# Skeleton: plan on PR, apply on merge, authenticated via GitHub OIDC (no long-lived keys).
# Fill in the role ARN output by the iam-github-oidc module, then remove the `if: false` guards.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  AWS_REGION: us-west-2
  ENV: prod

jobs:
  plan:
    if: false   # TODO: enable once ROLE_TO_ASSUME is set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          # role-to-assume: arn:aws:iam::<account-id>:role/github-actions-deploy   # TODO
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Plan
        run: make plan ENV=${{ env.ENV }}

  apply:
    if: false   # TODO: enable and gate on an environment protection rule
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Apply
        run: |
          cd live/${{ env.ENV }}/us-west-2/${{ env.ENV }}
          terragrunt stack generate
          terragrunt run --all apply --non-interactive
