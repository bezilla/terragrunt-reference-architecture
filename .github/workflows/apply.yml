name: apply

# Apply on merge to main, one stack at a time, gated by GitHub Environments.
#
# The consumer MUST create three environments (Settings > Environments): "management", "staging",
# and "prod". Put required reviewers on "prod" (and optionally a wait timer) so a human approves
# production applies. The jobs run in order management -> staging -> prod; a failure stops the chain.
#
# Authenticates with OIDC via the AWS_APPLY_ROLE_ARN repository variable. Unset => the guard inside
# each stack job skips the apply. The apply role's trust policy is the plan role's, with the sub
# condition scoped to `repo:<OWNER>/<REPO>:ref:refs/heads/main` and (ideally) `:environment:<name>`.
#
# Two paths, decided by `precheck` before any environment is entered:
#
#   deploy  -> the three gated jobs run in order and GitHub records the deployments itself.
#             `prod` carries a required-reviewer rule, so a human is asked -- which is the point,
#             because there is a real apply behind the prompt.
#   record  -> an ungated job writes the same three deployment records through the API and marks
#             them for what they are. No environment is entered, so nothing waits on a reviewer.
#
# This exists because environment protection is evaluated BEFORE a job's first step runs: a job
# cannot both enter an environment and decline to wait. Gating the jobs keeps docs-only pushes from
# costing an approval; minting the records out of band keeps the Environments panel current anyway.

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

# One apply at a time, ever — never let two runs mutate state concurrently.
concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  # Ungated on purpose, and first. Decides whether there is a real deploy to make, so that
  # reviewers are only asked when something behind the prompt actually changes infrastructure.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }

      - id: decide
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed="$(git show --name-only --format= "${{ github.sha }}")"
          else
            changed="$(git diff --name-only "$before" "${{ github.sha }}" 2>/dev/null \
              || git show --name-only --format= "${{ github.sha }}")"
          fi

          # Only infrastructure paths can change what an apply would do. A README or a diagram
          # cannot, and must not cost a reviewer an approval prompt.
          if printf '%s\n' "$changed" | grep -qE '^(live/|catalog/|modules/)'; then
            paths=true
          else
            paths=false
          fi
          [ -n "${{ vars.AWS_APPLY_ROLE_ARN }}" ] && role=true || role=false
          echo "infrastructure paths changed: $paths"
          echo "apply role configured: $role"
          printf '%s\n' "$changed" | sed 's/^/  /'

          if [ "$paths" = true ] && [ "$role" = true ]; then
            echo "deploy=true"  >> "$GITHUB_OUTPUT"
            echo "reason=apply"  >> "$GITHUB_OUTPUT"
          elif [ "$paths" = true ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=No-op: infrastructure changed but no AWS role is configured" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=No-op: no infrastructure paths changed by this push" >> "$GITHUB_OUTPUT"
          fi

  management:
    needs: precheck
    if: needs.precheck.outputs.deploy == 'true'
    uses: ./.github/workflows/apply-stack.yml
    with:
      stack: management/us-west-2/global
      environment: management
    secrets: inherit

  staging:
    needs: [precheck, management]
    if: needs.precheck.outputs.deploy == 'true'
    uses: ./.github/workflows/apply-stack.yml
    with:
      stack: staging/us-west-2/staging
      environment: staging
    secrets: inherit

  prod:
    needs: [precheck, staging]
    if: needs.precheck.outputs.deploy == 'true'
    uses: ./.github/workflows/apply-stack.yml
    with:
      stack: prod/us-west-2/prod
      environment: prod
    secrets: inherit

  # The other path. When there is no apply to make, the environments would otherwise hear nothing
  # and the panel would still be describing an older commit. This job records the same three
  # deployments through the API, in the same order, and says on each one why nothing was applied --
  # so the panel tracks main without ever claiming an AWS deployment that did not happen.
  #
  # It carries no `environment:`, so no protection rule is evaluated and no reviewer is asked.
  # auto_inactive is disabled so earlier records keep their own history rather than being blanked.
  record:
    needs: precheck
    if: needs.precheck.outputs.deploy != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Record a no-op deployment per environment
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ needs.precheck.outputs.reason }}
        run: |
          set -euo pipefail
          url="${{ github.server_url }}/${{ github.repository }}#reference-boundary"
          for env in management staging prod; do
            id="$(jq -nc --arg r "${{ github.sha }}" --arg e "$env" --arg d "$REASON" \
                    '{ref:$r, environment:$e, task:"deploy", auto_merge:false,
                       required_contexts:[], description:$d, transient_environment:false,
                       production_environment:($e=="prod")}' \
                  | gh api -X POST "repos/${{ github.repository }}/deployments" --input - --jq '.id')"
            jq -nc --arg d "$REASON" --arg u "$url" \
              '{state:"success", description:$d, environment_url:$u, auto_inactive:false}' \
              | gh api -X POST "repos/${{ github.repository }}/deployments/$id/statuses" --input - >/dev/null
            echo "recorded $env deployment $id -- $REASON"
          done
