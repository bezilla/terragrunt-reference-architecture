name: apply

# Apply on merge to main, one stack at a time, gated by GitHub Environments.
#
# The consumer MUST create three environments (Settings > Environments): "management", "staging",
# and "prod". Put required reviewers on "prod" (and optionally a wait timer) so a human approves
# production applies. The jobs run in order management -> staging -> prod; a failure stops the chain.
#
# It does NOT bootstrap state. Each account's state bucket is created once, by hand, before its
# first apply (`make bootstrap ACCOUNT=<account>`); see docs/adr/0011. The stacks applied here
# assume it exists.
#
# Authenticates with OIDC via the AWS_APPLY_ROLE_ARN repository variable. Unset => the guard inside
# each stack job skips the apply. The apply role's trust policy is the plan role's, with the sub
# condition scoped to `repo:<OWNER>/<REPO>:ref:refs/heads/main` and (ideally) `:environment:<name>`.
#
# Two paths, decided by `precheck` before any environment is entered:
#
#   deploy  -> the three gated jobs run in order and GitHub records the deployments itself.
#             `prod` carries a required-reviewer rule, so a human is asked -- which is the point,
#             because there is a real apply behind the prompt.
#   record  -> an ungated job writes the same three deployment records through the API and marks
#             them for what they are. No environment is entered, so nothing waits on a reviewer.
#
# This exists because environment protection is evaluated BEFORE a job's first step runs: a job
# cannot both enter an environment and decline to wait. Gating the jobs keeps docs-only pushes from
# costing an approval; minting the records out of band keeps the Environments panel current anyway.
#
# READ THE PANEL ACCORDINGLY. Environment protection gates Actions JOBS, not the Deployments API:
# `required_reviewers` on prod stops the gated job from starting, and has no say over a record
# written with `deployments: write`. So a record minted by the `record` job carries no reviewer
# sign-off, and none was asked for -- it attests that the workflow ran, nothing more. Only records
# from the deploy path mean a human approved an apply. The no-op records say so in their own
# description; this note is here because the panel itself cannot show you which path produced a
# green tick. Anything that would make the distinction load-bearing -- treating the panel as an
# audit trail, or gating a release on it -- needs a check on the deployment's creator and
# description, not on its colour.

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

# One apply at a time, ever — never let two runs mutate state concurrently.
concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  # Ungated on purpose, and first. Decides whether there is a real deploy to make, so that
  # reviewers are only asked when something behind the prompt actually changes infrastructure.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }

      - id: decide
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed="$(git show --name-only --format= "${{ github.sha }}")"
          else
            changed="$(git diff --name-only "$before" "${{ github.sha }}" 2>/dev/null \
              || git show --name-only --format= "${{ github.sha }}")"
          fi

          # Only infrastructure paths can change what an apply would do. A README or a diagram
          # cannot, and must not cost a reviewer an approval prompt.
          if printf '%s\n' "$changed" | grep -qE '^(live/|catalog/|modules/)'; then
            paths=true
          else
            paths=false
          fi
          [ -n "${{ vars.AWS_APPLY_ROLE_ARN }}" ] && role=true || role=false
          echo "infrastructure paths changed: $paths"
          echo "apply role configured: $role"
          printf '%s\n' "$changed" | sed 's/^/  /'

          # The decision turns on the CHANGED PATHS ALONE, deliberately. Conditioning it on the
          # role as well made the prod approval gate unreachable: with no role configured, deploy
          # was never true, the prod job never entered its environment, and a required-reviewer
          # rule that never fires is not a gate. An infrastructure change is exactly what a
          # reviewer should be asked about, whether or not this repository can currently apply it;
          # if there is no role, the guard inside the stack job skips the apply after approval.
          if [ "$paths" = true ]; then
            echo "deploy=true"  >> "$GITHUB_OUTPUT"
            echo "reason=apply"  >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=No-op: no infrastructure paths changed by this push" >> "$GITHUB_OUTPUT"
          fi

  management:
    needs: precheck
    if: needs.precheck.outputs.deploy == 'true'
    uses: ./.github/workflows/apply-stack.yml
    with:
      stack: management/us-west-2/global
      environment: management
    secrets: inherit

  staging:
    needs: [precheck, management]
    if: needs.precheck.outputs.deploy == 'true'
    uses: ./.github/workflows/apply-stack.yml
    with:
      stack: staging/us-west-2/staging
      environment: staging
    secrets: inherit

  prod:
    needs: [precheck, staging]
    if: needs.precheck.outputs.deploy == 'true'
    uses: ./.github/workflows/apply-stack.yml
    with:
      stack: prod/us-west-2/prod
      environment: prod
    secrets: inherit

  # When the gated path runs without a role, Actions still marks each deployment "success"
  # because the job exited 0 -- the guard inside simply skipped the apply. Left alone that reads
  # as a live AWS deployment. This job carries no `environment:` (so it never waits) and runs last
  # (so its status lands after Actions' own), and it speaks only when there was no role to deploy
  # with. A real apply keeps Actions' status untouched.
  label:
    needs: [management, staging, prod]
    if: always() && needs.management.result == 'success' && vars.AWS_APPLY_ROLE_ARN == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Mark the approved deployments as guard no-ops
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          url="${{ github.server_url }}/${{ github.repository }}#reference-boundary"
          desc='No-op: approved, but no AWS role is configured so nothing was applied'
          for env in management staging prod; do
            id="$(gh api "repos/${{ github.repository }}/deployments?environment=$env&sha=${{ github.sha }}" \
                    --jq '.[0].id // empty' 2>/dev/null)" || id=""
            if [ -z "$id" ]; then
              echo "::warning::no deployment recorded for $env; nothing to label."
              continue
            fi
            if ! err="$(jq -nc --arg d "$desc" --arg u "$url" \
                 '{state:"success", description:$d, environment_url:$u, auto_inactive:false}' \
                 | gh api -X POST "repos/${{ github.repository }}/deployments/$id/statuses" --input - 2>&1)"; then
              echo "::warning::could not label $env deployment $id: $err"
              continue
            fi
            echo "labelled $env deployment $id as an approved no-op."
          done
          exit 0

  # The other path. When there is no apply to make, the environments would otherwise hear nothing
  # and the panel would still be describing an older commit. This job records the same three
  # deployments through the API, in the same order, and says on each one why nothing was applied --
  # so the panel tracks main without ever claiming an AWS deployment that did not happen.
  #
  # It carries no `environment:`, so no protection rule is evaluated and no reviewer is asked.
  # auto_inactive is disabled so earlier records keep their own history rather than being blanked.
  record:
    needs: precheck
    if: needs.precheck.outputs.deploy != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Record a no-op deployment per environment
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ needs.precheck.outputs.reason }}
        run: |
          # Deliberately NOT `set -e`. These records are informational: they tell the Environments
          # panel which commit main is on. Nothing downstream reads them, so a 403, a rate limit or
          # a malformed response must not turn a docs-only push red. Every call is checked by hand
          # and a failure warns and moves on; the run stays green and the panel simply lags.
          set -uo pipefail

          # NOTE: this list duplicates the environments named in the `with:` blocks of the
          # management/staging/prod jobs above. There is no way to derive one from the other in
          # workflow syntax. ADD A FOURTH ENVIRONMENT TO THE CHAIN AND YOU MUST ADD IT HERE TOO,
          # or that environment silently stops being recorded on non-deploying pushes.
          envs="management staging prod"

          url="${{ github.server_url }}/${{ github.repository }}#reference-boundary"
          failed=0
          for env in $envs; do
            # production_environment stays false so both paths label prod identically -- Actions
            # writes false for its own deployments, and a flag that disagrees between the two paths
            # is worse than one that is merely conservative.
            payload="$(jq -nc --arg r "${{ github.sha }}" --arg e "$env" --arg d "$REASON" \
              '{ref:$r, environment:$e, task:"deploy", auto_merge:false, required_contexts:[],
                description:$d, transient_environment:false, production_environment:false}')"

            if ! id="$(printf '%s' "$payload" \
                 | gh api -X POST "repos/${{ github.repository }}/deployments" --input - --jq '.id' 2>&1)"; then
              echo "::warning::could not create the $env deployment record: $id"
              failed=$((failed + 1)); continue
            fi
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "::warning::the $env deployment was accepted but returned no id; skipping its status."
              failed=$((failed + 1)); continue
            fi

            if ! err="$(jq -nc --arg d "$REASON" --arg u "$url" \
                 '{state:"success", description:$d, environment_url:$u, auto_inactive:false}' \
                 | gh api -X POST "repos/${{ github.repository }}/deployments/$id/statuses" --input - 2>&1)"; then
              echo "::warning::recorded $env deployment $id but could not set its status: $err"
              failed=$((failed + 1)); continue
            fi
            echo "recorded $env deployment $id -- $REASON"
          done

          if [ "$failed" -gt 0 ]; then
            echo "::notice::$failed of 3 environment records were not written; the panel will lag this commit."
          fi
          exit 0
