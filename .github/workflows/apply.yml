name: apply

# Apply on merge to main, one stack at a time, gated by GitHub Environments.
#
# The consumer MUST create three environments (Settings > Environments): "management", "staging",
# and "prod". Put required reviewers on "prod" (and optionally a wait timer) so a human approves
# production applies. The jobs run in order management -> staging -> prod; a failure stops the chain.
#
# Authenticates with OIDC via the AWS_APPLY_ROLE_ARN repository variable. Unset => the guard inside
# each stack job skips the apply. The apply role's trust policy is the plan role's, with the sub
# condition scoped to `repo:<OWNER>/<REPO>:ref:refs/heads/main` and (ideally) `:environment:<name>`.
#
# NOTE the jobs enter their environments unconditionally, so every push to main records a deployment
# against management, staging and prod -- and, because `prod` carries a required-reviewer rule, every
# push asks a reviewer to approve it. That is the cost of having the Environments panel reflect each
# push; a guard cannot avoid it, because environment protection is evaluated BEFORE a job's first
# step runs. If unattended approval prompts become a nuisance, gate the three jobs on a preceding
# ungated job that decides whether a deploy is warranted -- at the price of no deployment record on
# the pushes it skips.

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

# One apply at a time, ever — never let two runs mutate state concurrently.
concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  management:
    uses: ./.github/workflows/apply-stack.yml
    with:
      stack: management/us-west-2/global
      environment: management
    secrets: inherit

  staging:
    needs: management
    uses: ./.github/workflows/apply-stack.yml
    with:
      stack: staging/us-west-2/staging
      environment: staging
    secrets: inherit

  prod:
    needs: staging
    uses: ./.github/workflows/apply-stack.yml
    with:
      stack: prod/us-west-2/prod
      environment: prod
    secrets: inherit

  # Say what the run actually did.
  #
  # GitHub records a deployment for every job that enters an environment and marks it "success"
  # whenever that job exits 0 -- including when the guard inside skipped the apply because no role
  # is configured. Left alone the Environments panel therefore reads "deployed successfully" for a
  # run that touched no AWS account, which contradicts the reference boundary stated in the README.
  #
  # This job carries no `environment:`, so it never waits on a protection rule, and it runs last so
  # its status lands AFTER the one Actions writes for each stack job. It only speaks when there was
  # no role to deploy with; a real apply keeps Actions' own status untouched.
  label:
    needs: [management, staging, prod]
    if: always() && vars.AWS_APPLY_ROLE_ARN == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Mark the deployments as guard no-ops
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for env in management staging prod; do
            id="$(gh api "repos/${{ github.repository }}/deployments?environment=$env&sha=${{ github.sha }}" \
                    --jq '.[0].id // empty')"
            if [ -z "$id" ]; then
              echo "no deployment recorded for $env; nothing to label."
              continue
            fi
            gh api -X POST "repos/${{ github.repository }}/deployments/$id/statuses" \
              -f state=success \
              -f description='No-op: guard pass only, no AWS apply (AWS_APPLY_ROLE_ARN unset)' \
              -f environment_url="${{ github.server_url }}/${{ github.repository }}#reference-boundary" \
              >/dev/null
            echo "labelled $env deployment $id as a guard no-op."
          done
