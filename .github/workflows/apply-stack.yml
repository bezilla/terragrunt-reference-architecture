name: apply-stack

# Reusable single-stack apply, called by apply.yml once per environment.
#
# Assumes the account's state bucket ALREADY EXISTS. Bootstrapping it is a separate, once-per-
# account operation run by hand outside CI (`make bootstrap ACCOUNT=<account>`, see docs/adr/0011):
# its unit sits outside every terragrunt.stack.hcl, so the `run --all` below cannot reach it. On an
# account that was never bootstrapped this job fails at backend initialisation, which is the
# intended failure -- CI creating the bucket it stores its own state in is the loop worth refusing.
on:
  workflow_call:
    inputs:
      stack:       { required: true, type: string }
      environment: { required: true, type: string }

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # gates on the environment's protection rules
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - id: guard
        run: |
          if [ -z "${{ vars.AWS_APPLY_ROLE_ARN }}" ]; then
            echo "AWS_APPLY_ROLE_ARN is not set — skipping apply for ${{ inputs.stack }}."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}

      - name: Seed account config
        if: steps.guard.outputs.enabled == 'true'
        run: for a in management staging prod; do cp live/$a/account.hcl.example live/$a/account.hcl; done

      - name: Terragrunt apply
        if: steps.guard.outputs.enabled == 'true'
        run: |
          cd "live/${{ inputs.stack }}"
          terragrunt stack generate
          terragrunt run --all apply --non-interactive
