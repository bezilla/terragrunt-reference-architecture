name: drift

# Weekly drift detection. Plans every stack; if any shows changes, opens (or updates) an issue.
# Uses the plan role (read-only is enough). Skips cleanly when AWS_PLAN_ROLE_ARN is unset.

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - management/us-west-2/global
          - staging/us-west-2/staging
          - prod/us-west-2/prod
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4

      - id: guard
        run: |
          if [ -z "${{ vars.AWS_PLAN_ROLE_ARN }}" ]; then
            echo "AWS_PLAN_ROLE_ARN is not set — skipping drift check."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.guard.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}

      - name: Seed account config
        if: steps.guard.outputs.enabled == 'true'
        run: for a in management staging prod; do cp live/$a/account.hcl.example live/$a/account.hcl; done

      - name: Plan and detect drift
        if: steps.guard.outputs.enabled == 'true'
        id: drift
        run: |
          cd "live/${{ matrix.stack }}"
          terragrunt stack generate
          if terragrunt run --all plan --non-interactive --detailed-exitcode; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" = "2" ]; then echo "drift=true" >> "$GITHUB_OUTPUT"; else exit $code; fi
          fi

      - name: Open drift issue
        if: steps.guard.outputs.enabled == 'true' && steps.drift.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const stack = "${{ matrix.stack }}";
            const title = `Drift detected: ${stack}`;
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'drift' });
            const found = existing.data.find(i => i.title === title);
            const body = `The weekly drift check found uncommitted changes in \`${stack}\`. Review the run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (found) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['drift'] });
            }
