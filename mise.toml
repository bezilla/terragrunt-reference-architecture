# Pinned toolchain for reproducible runs. Install with: mise install
[tools]
opentofu       = "1.12.6"
terragrunt     = "1.1.3"
tflint         = "0.64.0"
trivy          = "0.74.0"
terraform-docs = "0.24.0"

[env]
# Default every OpenTofu/Terragrunt invocation in this repo to OpenTofu.
TG_TF_PATH = "tofu"
