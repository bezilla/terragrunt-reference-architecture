# gitleaks configuration (committed).
#
# Extends the built-in ruleset (AWS keys, private keys, tokens, etc.) and adds rules for the
# credential and identifier classes most likely to leak from an infrastructure repo. The
# origin company name is intentionally NOT in this file — that rule lives in a gitignored local
# config (.gitleaks.local.toml, generated by `make`/CI from a secret) so the name never enters the
# repository or its history. Run locally with: gitleaks detect --config .gitleaks.local.toml
title = "reference-architecture"

[extend]
useDefault = true

[[rules]]
id = "datadog-api-or-app-key"
description = "Datadog API (32 hex) or App (40 hex) key assigned to a dd_*_key field"
regex = '''(?i)dd_(api|app)_key\s*[=:]\s*["']?[0-9a-f]{32,40}["']?'''
tags = ["datadog", "secret"]

[[rules]]
id = "real-aws-account-id"
description = "A 12-digit AWS account id that is not one of the repo's documented placeholders"
regex = '''arn:aws:[a-z0-9-]*:[a-z0-9-]*:([0-9]{12}):'''
tags = ["aws", "account-id"]
[rules.allowlist]
description = "Documented placeholder account IDs and AWS service-owned accounts"
regexes = [
  '''(123456789012|222222222222|333333333333|210987654321)''',
  '''aws:policy''', # arn:aws:iam::aws:policy/... service-managed, no account id
]

[allowlist]
description = "Global allowlist"
paths = [
  '''\.terraform\.lock\.hcl$''', # provider hashes, not secrets
]
